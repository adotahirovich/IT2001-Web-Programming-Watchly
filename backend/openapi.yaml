        product_id: { type: integer }
        quantity: { type: integer }
    Order:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        total: { type: number }
        status: { type: string }
        items_json: { type: string }
        created_at: { type: string, format: date-time }
    Review:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
