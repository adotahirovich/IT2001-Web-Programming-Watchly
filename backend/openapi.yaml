openapi: 3.0.3
info:
  title: Watchly API
  version: 1.0.0
  description: REST API for Watchly products, carts, orders, users, roles and reviews.
servers:
  - url: ..
    description: Backend directory containing the API
tags:
  - name: System
  - name: Authentication
  - name: Roles
  - name: Users
  - name: Products
  - name: Cart
  - name: Orders
  - name: Reviews
  - name: External API
paths:
  /api/health:
    get:
      tags: [System]
      summary: Check whether the API is running
      responses:
        '200':
          description: API is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
  /api/auth/register:
    post:
      tags: [Authentication]
      summary: Register a customer account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
      responses:
        '201':
          description: Customer account created and access token returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Log in and receive a JWT access token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/roles:
    get:
      tags: [Roles]
      summary: List roles (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/RoleList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Roles]
      summary: Create a role (admin only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        '201': { $ref: '#/components/responses/CreatedRole' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/roles/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Roles]
      summary: Get a role (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/RoleResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      tags: [Roles]
      summary: Replace a role name (admin only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        '200': { $ref: '#/components/responses/RoleResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
    patch:
      tags: [Roles]
      summary: Update a role name (admin only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        '200': { $ref: '#/components/responses/RoleResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Roles]
      summary: Delete a role (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/users:
    get:
      tags: [Users]
      summary: List users (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/UserList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Users]
      summary: Create a user (admin only; use registration for customers)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUserInput' }
      responses:
        '201': { $ref: '#/components/responses/CreatedUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/users/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Users]
      summary: Get a user (admin or that account owner)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/UserResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      tags: [Users]
      summary: Update a user (admin or that account owner)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdateInput' }
      responses:
        '200': { $ref: '#/components/responses/UserResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
    patch:
      tags: [Users]
      summary: Partially update a user (admin or that account owner)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdateInput' }
      responses:
        '200': { $ref: '#/components/responses/UserResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Users]
      summary: Delete a user (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/products:
    get:
      tags: [Products]
      summary: List products
      responses:
        '200': { $ref: '#/components/responses/ProductList' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Products]
      summary: Create a product (admin only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201': { $ref: '#/components/responses/CreatedProduct' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/products/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Products]
      summary: Get a product
      responses:
        '200': { $ref: '#/components/responses/ProductResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      tags: [Products]
      summary: Update product fields (admin only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '200': { $ref: '#/components/responses/ProductResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    patch:
      tags: [Products]
      summary: Partially update a product (admin only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductUpdateInput' }
      responses:
        '200': { $ref: '#/components/responses/ProductResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Products]
      summary: Delete a product (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/cart:
    get:
      tags: [Cart]
      summary: List the current user's cart items (admin can list all)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/CartList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Cart]
      summary: Add a product to the current user's cart
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartInput' }
      responses:
        '201': { $ref: '#/components/responses/CreatedCart' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/cart/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Cart]
      summary: Get a cart item owned by the current user
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/CartResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      tags: [Cart]
      summary: Update cart item quantity
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartUpdateInput' }
      responses:
        '200': { $ref: '#/components/responses/CartResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    patch:
      tags: [Cart]
      summary: Partially update cart item quantity
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartUpdateInput' }
      responses:
        '200': { $ref: '#/components/responses/CartResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Cart]
      summary: Remove a cart item owned by the current user
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/orders:
    get:
      tags: [Orders]
      summary: List orders (customers see only their own)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/OrderList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Orders]
      summary: Place an order; prices and total are calculated from product records
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderInput' }
      responses:
        '201': { $ref: '#/components/responses/CreatedOrder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/orders/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Orders]
      summary: Get an order (admin or order owner)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/OrderResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      tags: [Orders]
      summary: Update order status (admin only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderUpdateInput' }
      responses:
        '200': { $ref: '#/components/responses/OrderResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    patch:
      tags: [Orders]
      summary: Partially update order status (admin only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderUpdateInput' }
      responses:
        '200': { $ref: '#/components/responses/OrderResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Orders]
      summary: Delete an order (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/reviews:
    get:
      tags: [Reviews]
      summary: List product reviews
      responses:
        '200': { $ref: '#/components/responses/ReviewList' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Reviews]
      summary: Create a review for a product (authenticated customer)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewInput' }
      responses:
        '201': { $ref: '#/components/responses/CreatedReview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/reviews/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Reviews]
      summary: Get a review
      responses:
        '200': { $ref: '#/components/responses/ReviewResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      tags: [Reviews]
      summary: Update a review (owner or admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewUpdateInput' }
      responses:
        '200': { $ref: '#/components/responses/ReviewResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    patch:
      tags: [Reviews]
      summary: Partially update a review (owner or admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewUpdateInput' }
      responses:
        '200': { $ref: '#/components/responses/ReviewResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Reviews]
      summary: Delete a review (owner or admin)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/exchange-rate:
    get:
      tags: [External API]
      summary: Retrieve the current EUR to BAM rate from ExchangeRate-API
      description: Requires an API key stored in backend/config/config.php and times out after the configured limit.
      responses:
        '200':
          description: Exchange rate received
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExchangeRate' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '500': { $ref: '#/components/responses/ServerError' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, maxLength: 100 }
        email: { type: string, format: email, maxLength: 190 }
        password: { type: string, minLength: 8, maxLength: 72 }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    RoleInput:
      type: object
      required: [name]
      properties:
        name: { type: string, enum: [admin, customer] }
    AdminUserInput:
      type: object
      required: [name, email, password, role_id]
      properties:
        name: { type: string, maxLength: 100 }
        email: { type: string, format: email, maxLength: 190 }
        password: { type: string, minLength: 8, maxLength: 72 }
        role_id: { type: integer, minimum: 1 }
    UserUpdateInput:
      type: object
      properties:
        name: { type: string, maxLength: 100 }
        email: { type: string, format: email, maxLength: 190 }
        password: { type: string, minLength: 8, maxLength: 72 }
        role_id: { type: integer, minimum: 1, description: Admin only }
    ProductInput:
      type: object
      required: [name, category, price]
      properties:
        name: { type: string, maxLength: 150 }
        category: { type: string, enum: [Satovi, Nakit] }
        price: { type: number, minimum: 0 }
        stock: { type: integer, minimum: 0, default: 0 }
    ProductUpdateInput:
      type: object
      properties:
        name: { type: string, maxLength: 150 }
        category: { type: string, enum: [Satovi, Nakit] }
        price: { type: number, minimum: 0 }
        stock: { type: integer, minimum: 0 }
    CartInput:
      type: object
      required: [product_id]
      properties:
        product_id: { type: integer, minimum: 1 }
        quantity: { type: integer, minimum: 1, default: 1 }
    CartUpdateInput:
      type: object
      required: [quantity]
      properties:
        quantity: { type: integer, minimum: 1 }
    OrderInput:
      type: object
      required: [items]
      properties:
        user_id: { type: integer, minimum: 1, description: Admin only }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [product_id, quantity]
            properties:
              product_id: { type: integer, minimum: 1 }
              quantity: { type: integer, minimum: 1 }
    OrderUpdateInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [pending, paid, shipped, cancelled] }
    ReviewInput:
      type: object
      required: [product_id, rating]
      properties:
        product_id: { type: integer, minimum: 1 }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, maxLength: 1000, nullable: true }
    ReviewUpdateInput:
      type: object
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, maxLength: 1000, nullable: true }
    Role:
