<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watchly - Exclusive Watches & Jewelry</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3 text-uppercase tracking-wider" href="#" onclick="showPage('home')">
                <i class="fa-regular fa-clock me-2 text-warning"></i>Watchly
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto ms-lg-4">
                    <li class="nav-item">
                        <a class="nav-link nav-item-link active" id="nav-home" href="#" onclick="showPage('home')">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-item-link" id="nav-products" href="#" onclick="showPage('products')">Collection</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-item-link" id="nav-cart" href="#" onclick="showPage('cart')">
                            <i class="fa-solid fa-cart-shopping me-1"></i>Cart
                            <span class="badge bg-warning text-dark" id="cart-count">0</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-item-link" id="nav-external-api" href="#" onclick="showPage('external-api')">Currency (API)</a>
                    </li>
                </ul>

                <span class="text-light small me-lg-3" id="current-role-label">Guest</span>

                <ul class="navbar-nav align-items-lg-center">
                    <li class="nav-item guest-only">
                        <a class="nav-link nav-item-link" id="nav-login" href="#" onclick="showPage('login')"><i class="fa-solid fa-right-to-bracket me-1"></i>Log in</a>
                    </li>
                    <li class="nav-item guest-only">
                        <a class="btn btn-outline-warning btn-sm ms-lg-2" id="nav-register" href="#" onclick="showPage('register')">Register</a>
                    </li>

                    <li class="nav-item user-only d-none">
                        <a class="nav-link nav-item-link" id="nav-orders" href="#" onclick="showPage('orders')"><i class="fa-solid fa-box me-1"></i>My Orders</a>
                    </li>

                    <li class="nav-item admin-only d-none">
                        <a class="btn btn-warning btn-sm fw-bold ms-lg-2" id="nav-admin" href="#" onclick="showPage('admin')"><i class="fa-solid fa-shield-halved me-1"></i>Admin Panel</a>
                    </li>

                    <li class="nav-item logout-only d-none ms-lg-2">
                        <button class="btn btn-sm btn-outline-danger" onclick="logout()" aria-label="Log out" title="Log out"><i class="fa-solid fa-power-off"></i></button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-4 min-vh-100">
        <div id="app-view" aria-live="polite"></div>
    </main>

    <footer class="bg-dark text-white py-4 mt-5 border-top border-secondary">
        <div class="container text-center text-md-start">
            <div class="row">
                <div class="col-md-6 mb-3 mb-md-0">
                    <h5 class="fw-bold text-warning">Watchly Shop</h5>
                    <p class="small text-muted mb-0">Web Programming course project (2026)</p>
                </div>
                <div class="col-md-6 text-md-end">
                    <p class="small text-muted mb-1">&copy; 2026 Watchly. All rights reserved.</p>
                    <p class="small text-muted mb-1">Sadullah-Ado Thirovic — Watchly, 2026</p>
                    <span class="badge bg-secondary">Milestone 1 - Static SPA Frontend</span>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
