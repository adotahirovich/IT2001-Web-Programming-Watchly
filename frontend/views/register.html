<section id="page-register" class="page-section d-none">
            <div class="row justify-content-center py-4">
                <div class="col-md-6">
                    <div class="card border-0 shadow-lg p-4">
                        <div class="text-center mb-4">
                            <i class="fa-solid fa-user-plus fs-1 text-warning"></i>
                            <h3 class="fw-bold mt-2">Registracija Novog Korisnika</h3>
                            <p class="text-muted small">Kreirajte račun za bržu kupovinu i praćenje narudžbi</p>
                        </div>
                        <form id="register-form" onsubmit="handleRegister(event)">
                            <div class="mb-3">
                                <label class="form-label">Ime i Prezime</label>
                                <input type="text" class="form-control" id="reg-name" placeholder="Marko Marković" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email adresa</label>
                                <input type="email" class="form-control" id="reg-email" placeholder="marko@example.com" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Lozinka</label>
                                <input type="password" class="form-control" id="reg-password" placeholder="Minimalno 6 znakova" minlength="6" required>
                            </div>
                            <button type="submit" class="btn btn-warning w-100 py-2 fw-bold">Kreiraj Račun</button>
                        </form>
                        <hr class="my-4">
                        <div class="text-center">
                            <p class="small text-muted mb-0">Već imate račun? <a href="#" onclick="showPage('login')" class="text-dark text-decoration-none fw-bold">Prijavite se</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
